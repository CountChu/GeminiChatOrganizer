<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Chat Organizer</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <header>
    <h1>Gemini Chat Organizer</h1>
    <div class="actions">
      <label class="filter-toggle"><input type="checkbox" id="hide-hidden"> Hide hidden turns</label>
      <label class="filter-toggle"><input type="checkbox" id="hide-missing"> Hide missing turns</label>
      <label class="filter-toggle"><input type="checkbox" id="md-preview"> MD preview</label>
      <button id="metrics-btn" title="Show session/turn/topic counts">Show Metrics</button>
      <button id="organize-btn">Organize all</button>
      <button id="reload-btn" title="Re-parse from raw">Reload</button>
      <span id="status"></span>
    </div>
  </header>
  <main>
    <aside id="uncat-pane" class="sidebar">
      <div id="sessions-toolbar">
        <input id="search" type="search" placeholder="filter sessions…" />
        <button id="sort-btn" title="Toggle session sort order">Time ↑</button>
      </div>
      <div id="multi-select-bar" hidden>
        <span id="ms-count">0 selected</span>
        <button id="ms-create" title="Create a new Topic from selection">+ Topic</button>
        <select id="ms-add" title="Add selection to an existing Topic"><option value="">Add to…</option></select>
        <button id="ms-remove" title="Remove selection from its Topic" hidden>− Topic</button>
        <button id="ms-clear" title="Clear selection">×</button>
      </div>
      <section class="sidebar-group" id="uncat-group">
        <header class="group-header">
          <span class="group-title">Uncategorized</span>
          <span class="group-count" id="uncat-count">0</span>
        </header>
        <ul class="group-list" id="uncat-list"></ul>
      </section>
    </aside>
    <aside id="topics-pane" class="sidebar">
      <section class="sidebar-group" id="topics-group">
        <header class="group-header">
          <span class="group-title">Topics</span>
          <span class="group-count" id="topics-count">0</span>
          <button id="topics-sort-btn" title="Toggle topic sort order">Time ↑</button>
        </header>
        <div class="group-body" id="topics-body"></div>
      </section>
    </aside>
    <section id="turns-pane">
      <div id="turns-empty">Select a session or topic on the left.</div>
      <div id="topic-content" hidden>
        <div class="topic-head">
          <h2 id="topic-title"></h2>
          <button class="icon-btn" id="topic-rename" title="Rename Topic">✎</button>
        </div>
        <div id="topic-meta"></div>
        <textarea id="topic-description" rows="2" placeholder="Description (optional)"></textarea>
        <div class="topic-actions">
          <button id="topic-organize">Organize this Topic</button>
          <button id="topic-delete" class="danger">Delete Topic</button>
        </div>
        <h3>Sessions in this Topic</h3>
        <ol id="topic-sessions"></ol>
      </div>
      <div id="turns-content" hidden>
        <h2 id="session-title"></h2>
        <div id="session-meta"></div>
        <div id="turns-list"></div>
      </div>
    </section>
  </main>
  <div id="lock-overlay" hidden>Exporting… UI is locked.</div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
