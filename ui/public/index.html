<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Chat Organizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Gemini Chat Organizer</h1>
    <div class="actions">
      <label class="filter-toggle"><input type="checkbox" id="hide-hidden"> Hide hidden turns</label>
      <button id="organize-btn">Organize all</button>
      <button id="reload-btn" title="Re-parse from raw">Reload</button>
      <span id="status"></span>
    </div>
  </header>
  <main>
    <aside id="sessions-pane">
      <div id="sessions-toolbar">
        <input id="search" type="search" placeholder="filter sessions…" />
        <button id="sort-btn" title="Toggle session sort order">Time ↑</button>
      </div>
      <ul id="sessions-list"></ul>
    </aside>
    <section id="turns-pane">
      <div id="turns-empty">Select a session on the left.</div>
      <div id="turns-content" hidden>
        <h2 id="session-title"></h2>
        <div id="session-meta"></div>
        <div id="turns-list"></div>
      </div>
    </section>
  </main>
  <div id="lock-overlay" hidden>Exporting… UI is locked.</div>
  <script src="main.js"></script>
</body>
</html>
